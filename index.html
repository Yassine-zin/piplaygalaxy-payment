<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameSpace Galaxy</title>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(180deg,#050816,#08142f,#0b1d47);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
color:white;
}

.wrapper{
width:100%;
max-width:430px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border-radius:24px;
padding:26px;
box-shadow:0 0 30px rgba(0,0,0,.35);
}

.logo{
font-size:44px;
text-align:center;
margin-bottom:8px;
}

h1{
text-align:center;
font-size:32px;
margin-bottom:6px;
}

.sub{
text-align:center;
opacity:.85;
margin-bottom:22px;
font-size:16px;
}

.profile{
background:rgba(255,255,255,.07);
padding:16px;
border-radius:18px;
line-height:1.9;
font-size:16px;
margin-bottom:18px;
}

button{
width:100%;
border:none;
padding:16px;
border-radius:18px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
margin-bottom:12px;
transition:.25s;
}

button:active{
transform:scale(.97);
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

.login{background:#2563eb;}
.reward{background:#16a34a;}
.mission{background:#ea580c;}
.premium{background:#9333ea;}

.status{
margin-top:8px;
background:rgba(255,255,255,.07);
padding:15px;
border-radius:16px;
text-align:center;
font-size:16px;
min-height:55px;
}

.small{
text-align:center;
font-size:13px;
opacity:.75;
margin-top:10px;
}

.vip{
margin-top:14px;
padding:12px;
border-radius:16px;
text-align:center;
background:rgba(255,215,0,.12);
display:none;
font-weight:bold;
border:1px solid rgba(255,215,0,0.3);
}

.loading{
display:inline-block;
width:20px;
height:20px;
border:3px solid rgba(255,255,255,.3);
border-radius:50%;
border-top-color:white;
animation:spin 1s ease-in-out infinite;
margin-left:10px;
vertical-align:middle;
}

@keyframes spin{
to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="wrapper">

<div class="card">

<div class="logo">🚀</div>

<h1>GameSpace Galaxy</h1>

<div class="sub">
Play • Earn • Rule the Pi Universe
</div>

<div class="profile">
👤 <span id="username">Guest Mode</span><br>
🏆 Rank: <span id="rank">Rookie</span><br>
⭐ XP: <span id="xp">0</span><br>
🪙 Reward: <span id="coins">0.00</span> π
</div>

<button class="login" onclick="loginPi()" id="loginBtn">
🔐 Login with Pi
</button>

<button class="reward" onclick="claimReward()" id="rewardBtn">
🎁 Claim Daily Reward
</button>

<button class="mission" onclick="startMission()">
⚔️ Start Mission
</button>

<button class="premium" onclick="premiumAccess()" id="premiumBtn">
💎 Premium Access
</button>

<div class="status" id="status">
Welcome Commander
</div>

<div class="vip" id="vipbox">
👑 PREMIUM MEMBER ACTIVATED
</div>

<div class="small">
Powered by Pi Network | Testnet
</div>

</div>

</div>

<script>
/* =========================
   GAME DATA
========================= */

let currentUser = localStorage.getItem("gg_user") || "Guest Mode";
let xp = parseInt(localStorage.getItem("gg_xp")) || 0;
let coins = parseFloat(localStorage.getItem("gg_coins")) || 0;
let premium = localStorage.getItem("gg_premium") || "false";
let userAddress = localStorage.getItem("gg_address") || "";

/* =========================
   SAVE
========================= */

function saveGame(){
localStorage.setItem("gg_user", currentUser);
localStorage.setItem("gg_xp", xp);
localStorage.setItem("gg_coins", coins);
localStorage.setItem("gg_premium", premium);
localStorage.setItem("gg_address", userAddress);
}

/* =========================
   UI UPDATE
========================= */

function updateUI(){

document.getElementById("username").innerText = currentUser;
document.getElementById("xp").innerText = xp;
document.getElementById("coins").innerText = coins.toFixed(2);

let rank = "Rookie";

if(xp >= 500){
rank = "Legend";
}else if(xp >= 250){
rank = "Elite";
}else if(xp >= 100){
rank = "Warrior";
}

document.getElementById("rank").innerText = rank;

if(premium === "true"){
document.getElementById("vipbox").style.display="block";
document.getElementById("premiumBtn").disabled = true;
document.getElementById("premiumBtn").innerText = "✅ Premium Active";
}else{
document.getElementById("vipbox").style.display="none";
document.getElementById("premiumBtn").disabled = false;
document.getElementById("premiumBtn").innerText = "💎 Premium Access";
}

saveGame();
}

/* =========================
   LOGIN
========================= */

async function loginPi(){

const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");

try{

statusEl.innerHTML = "Initializing Pi SDK... <span class='loading'></span>";
loginBtn.disabled = true;

// Initialize Pi SDK for Testnet
Pi.init({
version:"2.0",
sandbox:true  // ✅ Testnet
});

const scopes = ['username','payments'];

function onIncompletePaymentFound(payment){
console.log("Incomplete payment found:", payment);
// Handle incomplete payment
}

statusEl.innerHTML = "Authenticating... <span class='loading'></span>";

const auth = await Pi.authenticate(
scopes,
onIncompletePaymentFound
);

currentUser = auth.user.username;
userAddress = auth.user.address;

statusEl.innerHTML = "Welcome " + currentUser + "!";
loginBtn.disabled = false;

updateUI();

}catch(e){

console.log(e);
statusEl.innerText = "Login failed: " + e.message;
loginBtn.disabled = false;

}

}

/* =========================
   DAILY REWARD
========================= */

function claimReward(){

const lastClaim = localStorage.getItem("gg_last_reward");
const now = Date.now();
const oneDay = 24 * 60 * 60 * 1000;

if(lastClaim && (now - lastClaim) < oneDay){
const hoursLeft = Math.ceil((oneDay - (now - lastClaim)) / (60 * 60 * 1000));
document.getElementById("status").innerText = 
`Come back in ${hoursLeft}h for next reward!`;
return;
}

coins += 0.01;
xp += 10;
localStorage.setItem("gg_last_reward", now);

document.getElementById("status").innerText = 
"🎁 Reward Claimed! +0.01 π | +10 XP";

updateUI();
}

/* =========================
   MISSION
========================= */

function startMission(){

const statusEl = document.getElementById("status");
statusEl.innerHTML = "⚔️ Mission in progress... <span class='loading'></span>";

setTimeout(() => {
xp += 25;
coins += 0.005;
statusEl.innerText = "✅ Mission Complete! +25 XP | +0.005 π";
updateUI();
}, 2000);

}

/* =========================
   PREMIUM
========================= */

async function premiumAccess(){

const statusEl = document.getElementById("status");
const premiumBtn = document.getElementById("premiumBtn");

try{

statusEl.innerHTML = "Creating payment... <span class='loading'></span>";
premiumBtn.disabled = true;

await Pi.createPayment(
{
amount: 0.10,
memo: "Premium Access - GameSpace Galaxy",
metadata: { 
type: "premium",
userId: currentUser,
timestamp: Date.now()
}
},
{
onReadyForServerApproval: function(paymentId){
console.log("Payment ready for approval:", paymentId);
statusEl.innerHTML = "Approving payment... <span class='loading'></span>";

// Send to backend for approval
fetch('/api/approve', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify({ paymentId })
})
.then(res => res.json())
.then(data => {
console.log("Approval response:", data);
})
.catch(err => {
console.error("Approval error:", err);
});
},

onReadyForServerCompletion: function(paymentId, txid){
console.log("Payment ready for completion:", paymentId, txid);
statusEl.innerHTML = "Completing payment... <span class='loading'></span>";

// Send to backend for completion
fetch('/api/complete', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify({ 
paymentId,
txid,
userId: currentUser
})
})
.then(res => res.json())
.then(data => {
if(data.success){
premium = "true";
xp += 100;
statusEl.innerText = "🎉 Premium Activated! +100 XP";
updateUI();
} else {
statusEl.innerText = "Payment verification failed";
premiumBtn.disabled = false;
}
})
.catch(err => {
console.error("Completion error:", err);
statusEl.innerText = "Server error";
premiumBtn.disabled = false;
});
},

onCancel: function(paymentId){
console.log("Payment cancelled:", paymentId);
statusEl.innerText = "❌ Payment Cancelled";
premiumBtn.disabled = false;
},

onError: function(error, payment){
console.error("Payment error:", error, payment);
statusEl.innerText = "❌ Payment Error: " + error.message;
premiumBtn.disabled = false;
}
}
);

}catch(err){

console.log(err);
statusEl.innerText = "Premium Error: " + err.message;
premiumBtn.disabled = false;

}

}

/* =========================
   AUTO LOAD
========================= */

window.onload = function() {
updateUI();
console.log("GameSpace Galaxy Loaded - Testnet Mode");
console.log("PiNet Subdomain: gamespacegalaxy1939");
};

</script>

</body>
</html>
